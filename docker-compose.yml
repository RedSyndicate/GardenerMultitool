version: '3.1'
services:
  # web:
  #   container_name: web
  #   image: gardenermultitool
  #   restart: always
  #   ports:
  #     - 8080:8080
  #   depends_on: 
  #     - api
  api:
    container_name: api
    image: gardenermultitool-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+;
    ports:
      - 5000:80
    depends_on:
      - qdrant
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant
    ports:
      - 6333:6333
      - 6334:6334